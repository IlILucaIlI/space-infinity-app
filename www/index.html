<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SPACE INFINITY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; }
        #overlay { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; background: rgba(0,0,0,0.8); }
        #menu { text-align: center; color: #fff; }
        .btn { 
            background: transparent; border: 2px solid #0ff; color: #0ff; padding: 15px 40px; 
            margin: 10px; font-size: 20px; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }
        
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; display: none; width: 300px; }
        .stat { font-size: 18px; margin-bottom: 5px; }
        
        #power-container { width: 100%; height: 20px; background: rgba(255,255,255,0.1); border: 1px solid #fff; margin-top: 10px; }
        #power-bar { width: 0%; height: 100%; background: #ff00ff; box-shadow: 0 0 15px #ff00ff; transition: 0.3s ease-out; }
        #enter-msg { font-size: 14px; color: #ff00ff; margin-top: 5px; display: none; font-weight: bold; animation: blink 0.5s infinite; }
        
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        #msg { position: absolute; top: 40%; width: 100%; text-align: center; color: #fff; font-size: 40px; display: none; z-index: 15; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="overlay">
        <div id="menu">
            <h1 style="font-size: 50px; margin-bottom: 10px;">SPACE INFINITY</h1>
            <p>Mover: [WASD] / Inclinación | Turbo: [ENTER] / Doble Toque</p>
            <button class="btn" onclick="startGame('career')">Modo Carrera</button>
            <button class="btn" onclick="startGame('infinite')">Modo Infinito</button>
        </div>
    </div>

    <div id="ui">
        <div id="lvl-txt" class="stat">NIVEL: 1</div>
        <div id="prog-txt" class="stat">PROGRESO: 0%</div>
        <div class="stat" style="margin-top:15px;">ENERGÍA (3 MONEDAS):</div>
        <div id="power-container"><div id="power-bar"></div></div>
        <div id="enter-msg">¡LISTO! DOBLE TOQUE</div>
    </div>

    <div id="msg"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const LEVELS = [
            { color: 0x00ffff, length: 1500, name: "CYBER CITY" },
            { color: 0x00ff00, length: 2000, name: "BIO TOXIC" },
            { color: 0xffff00, length: 2500, name: "VOLTAGE" },
            { color: 0xff0000, length: 3000, name: "CRITICAL ERROR" },
            { color: 0xffffff, length: 4000, name: "THE END" }
        ];

        let scene, camera, renderer, player, grid, portal;
        let gameState = 'menu', gameMode = 'career';
        let currentLvlIdx = 0, distance = 0, speed = 0.35;
        let obstacles = [], coins = [], particles = [];
        let power = 0, isTurbo = false, turboTimer = 0;
        let targetX = 0, targetY = 0;
        let lastColorChange = 0;
        let lastTapTime = 0;

        const keys = {};

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020005);
            scene.fog = new THREE.Fog(0x020005, 10, 85);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.BoxGeometry(1, 1, 1);
            player = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: LEVELS[0].color }));
            player.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
            scene.add(player);

            grid = new THREE.GridHelper(500, 80, 0xff00ff, 0x220022);
            grid.position.y = -2;
            scene.add(grid);

            portal = new THREE.Mesh(new THREE.TorusGeometry(5, 0.3, 16, 100), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            portal.position.z = -5000;
            scene.add(portal);

            spawnEntities();
            animate();
        }

        function spawnEntities() {
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = []; coins = [];

            for(let i = 0; i < 20; i++) {
                const oGeo = new THREE.BoxGeometry(Math.random()*3+1, Math.random()*4+1, 2);
                const oMesh = new THREE.Mesh(oGeo, new THREE.MeshBasicMaterial({ color: LEVELS[currentLvlIdx].color }));
                oMesh.position.set((Math.random()-0.5)*18, Math.random()*6-1, -40 - (i*35));
                scene.add(oMesh);
                obstacles.push(oMesh);

                const cGeo = new THREE.SphereGeometry(0.5, 12, 12);
                const cMesh = new THREE.Mesh(cGeo, new THREE.MeshBasicMaterial({ color: 0xffd700 }));
                cMesh.position.set((Math.random()-0.5)*18, Math.random()*6-1, -60 - (i*35));
                scene.add(cMesh);
                coins.push(cMesh);
            }
        }

        window.startGame = async (mode) => {
            gameMode = mode;
            
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    } else {
                        console.warn("Permiso de giroscopio denegado.");
                    }
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            } catch (error) {
                console.error("Error inicializando giroscopio:", error);
            }

            gameState = 'playing';
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            camera.position.set(0, 3, 10);
            
            if(mode === 'infinite') {
                lastColorChange = Date.now();
                document.getElementById('lvl-txt').style.display = 'none';
                document.getElementById('prog-txt').style.display = 'none';
            } else {
                document.getElementById('lvl-txt').style.display = 'block';
                document.getElementById('prog-txt').style.display = 'block';
            }
        };

        function createExplosion(pos, color) {
            for(let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshBasicMaterial({ color: color }));
                p.position.copy(pos);
                p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6) };
                scene.add(p);
                particles.push(p);
                setTimeout(() => { scene.remove(p); particles.splice(particles.indexOf(p), 1); }, 800);
            }
        }

        function handleTurbo() {
            if(keys['enter'] && power >= 100 && !isTurbo) {
                isTurbo = true;
                turboTimer = 240; 
                power = 0;
                document.getElementById('enter-msg').style.display = 'none';
            }

            if(isTurbo) {
                turboTimer--;
                camera.fov = 95; 
                camera.updateProjectionMatrix();
                
                const t = player.clone();
                t.material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
                scene.add(t);
                setTimeout(() => scene.remove(t), 150);

                if(turboTimer <= 0) {
                    isTurbo = false;
                    camera.fov = 75;
                    camera.updateProjectionMatrix();
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameState === 'playing') {
                let currentBaseSpeed = 0.4 + (currentLvlIdx * 0.1);
                speed = isTurbo ? 1.3 : currentBaseSpeed;
                distance += speed;
                handleTurbo();

                // Movimiento WASD (PC)
                if(keys['w']) targetY += 0.25; if(keys['s']) targetY -= 0.25;
                if(keys['a']) targetX -= 0.25; if(keys['d']) targetX += 0.25;
                
                targetX = THREE.MathUtils.clamp(targetX, -8, 8);
                targetY = THREE.MathUtils.clamp(targetY, -1.5, 6.5);
                
                player.position.lerp(new THREE.Vector3(targetX, targetY, 0), 0.15);
                player.rotation.z = (player.position.x - targetX) * 0.4;

                grid.position.z += speed; if(grid.position.z > 10) grid.position.z = 0;
                
                coins.forEach(c => {
                    c.position.z += speed;
                    c.rotation.y += 0.05;
                    if(player.position.distanceTo(c.position) < 1.6) {
                        c.position.z = -200;
                        power = Math.min(100, power + 34); 
                        if(power >= 100) document.getElementById('enter-msg').style.display = 'block';
                    }
                });

                obstacles.forEach(o => {
                    o.position.z += speed;
                    if(o.position.z > 12) {
                        o.position.z = -180;
                        o.position.x = (Math.random()-0.5)*18;
                    }
                    
                    if(player.position.distanceTo(o.position) < 1.8) {
                        if(isTurbo) {
                            createExplosion(o.position, o.material.color);
                            o.position.z = -200; 
                        } else {
                            gameOver();
                        }
                    }
                });

                particles.forEach(p => p.position.add(p.userData.vel));

                if(gameMode === 'infinite') {
                    if(Date.now() - lastColorChange > 6000) {
                        lastColorChange = Date.now();
                        const randomColor = Math.random() * 0xffffff;
                        player.material.color.setHex(randomColor);
                        grid.material.color.setHex(randomColor);
                        obstacles.forEach(o => o.material.color.setHex(randomColor));
                    }
                }

                document.getElementById('power-bar').style.width = Math.min(100, power) + '%';
                if(gameMode === 'career') {
                    let p = (distance / LEVELS[currentLvlIdx].length) * 100;
                    document.getElementById('prog-txt').innerText = `PROGRESO: ${Math.min(100, Math.floor(p))}%`;
                    if(p > 96) { portal.position.z = -(LEVELS[currentLvlIdx].length - distance + 5); portal.rotation.z += 0.05; }
                    if(distance >= LEVELS[currentLvlIdx].length && player.position.distanceTo(portal.position) < 6) nextLevel();
                }
            }
            renderer.render(scene, camera);
        }

        function nextLevel() {
            if(currentLvlIdx < LEVELS.length - 1) {
                currentLvlIdx++; distance = 0;
                const m = document.getElementById('msg');
                m.innerText = LEVELS[currentLvlIdx].name; m.style.display = 'block';
                setTimeout(() => m.style.display = 'none', 1500);
                spawnEntities();
                document.getElementById('lvl-txt').innerText = `NIVEL: ${currentLvlIdx + 1}`;
                player.material.color.set(LEVELS[currentLvlIdx].color);
                grid.material.color.set(LEVELS[currentLvlIdx].color);
                power = 0;
                portal.position.z = -5000;
            } else {
                document.getElementById('msg').innerHTML = "¡VICTORIA TOTAL!<br><button class='btn' onclick='location.reload()'>Menú Principal</button>";
                document.getElementById('msg').style.display = 'block';
                gameState = 'win';
            }
        }

        function gameOver() {
            gameState = 'over';
            document.getElementById('msg').innerHTML = "CHOCASTE<br><button class='btn' onclick='location.reload()'>Reintentar</button>";
            document.getElementById('msg').style.display = 'block';
        }

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // --- MOVIMIENTO MULTIDIRECCIONAL CON CELULAR (TODOS LOS LADOS) ---
        function handleOrientation(e) {
            if (gameState === 'playing' && e.gamma !== null && e.beta !== null) {
                let isLandscape = window.innerWidth > window.innerHeight;
                
                // Movimiento horizontal (Izquierda / Derecha)
                let tiltX = isLandscape ? e.beta : e.gamma; 
                let xInput = tiltX / 20; 
                targetX = THREE.MathUtils.clamp(xInput * 8, -8, 8);

                // Movimiento vertical (Arriba / Abajo)
                // Se toma ~45 grados como la inclinación neutral normal al sostener el celular
                let tiltY = isLandscape ? -e.gamma : e.beta; 
                let yInput = (tiltY - 45) / 20; 
                
                // Inclinar hacia arriba/atrás sube el personaje; inclinar hacia adelante lo baja
                targetY = THREE.MathUtils.clamp(2.5 - (yInput * 4), -1.5, 6.5);
            }
        }

        // --- DOBLE TOQUE CELULAR ---
        window.addEventListener('touchstart', (e) => {
            if (gameState === 'playing') {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < 300 && tapLength > 0) {
                    if (power >= 100 && !isTurbo) {
                        isTurbo = true;
                        turboTimer = 240; 
                        power = 0;
                        document.getElementById('enter-msg').style.display = 'none';
                    }
                    if (e.cancelable) e.preventDefault();
                }
                lastTapTime = currentTime;
            }
        }, { passive: false });

        init();
    </script>
</body>
</html>
